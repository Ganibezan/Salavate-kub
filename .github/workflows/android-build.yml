name: Android paket ve ekran kontrolu
on:
  push:
    branches: [android-play-preparation, main]
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run android:prepare
      - name: Android APK ve test paketini derle
        id: apk
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Google Play ses paketli AAB derle
        working-directory: android
        run: ./gradlew :app:bundleRelease -PplayAssetDelivery --stacktrace
      - name: AAB icerigini dogrula
        run: python3 scripts/verify-android.py android/app/build/outputs/bundle/release/app-release.aab
      - name: Emulator icin KVM erisimi
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gercek Android ekranlari ve cevrimdisi icerik testi
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            cd android && ./gradlew :app:connectedDebugAndroidTest --stacktrace
            mkdir -p android-artifacts/screenshots
            adb pull /sdcard/Pictures/SalavatBahcesiTest/. android-artifacts/screenshots/
      - name: APK dosyasini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salavat-android-apk
          retention-days: 14
          compression-level: 0
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Google Play AAB dosyasini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salavat-google-play-aab
          retention-days: 14
          compression-level: 0
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Ekranlari ve test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salavat-android-ekranlar
          retention-days: 14
          path: |
            android/app/build/reports/androidTests/
            android-artifacts/screenshots/*.png
