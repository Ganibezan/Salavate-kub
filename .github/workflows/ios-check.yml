name: iPhone derleme kontrolu
on:
  push:
    paths:
      - 'ios/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-check
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Tum sesleri uygulamaya al
        run: npm run ios:prepare
      - name: iPhone icin derle
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/SalavatBahcesi.xcarchive archive CODE_SIGNING_ALLOWED=NO | tee /tmp/ios-build.log
      - name: Paket icerigini dogrula
        run: python3 scripts/verify-ios.py build/SalavatBahcesi.xcarchive/Products/Applications/App.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-derleme-kaydi
          path: /tmp/ios-build.log
          retention-days: 3
