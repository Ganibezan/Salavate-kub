workflows:
  ios-app-store:
    name: Salavat Bahcesi - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: salavat-apple
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hayrullahbezan.salavatbahcesi
    scripts:
      - name: Bagimliliklari kur
        script: npm ci
      - name: Guncel uygulamayi ve butun sesleri paketle
        script: npm run ios:prepare
      - name: Apple imzasini uygula
        script: xcode-project use-profiles
      - name: Benzersiz derleme numarasi
        script: |
          cd ios/App
          agvtool new-version -all "$((BUILD_NUMBER + 1))"
      - name: App Store paketini olustur
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
